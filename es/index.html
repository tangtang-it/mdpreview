<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <a href="/es/" class="brand">
        <img src="/favicon.svg" alt="MDPreview Logo" class="brand-icon" width="30" height="30">
        <span>MDPreview</span>
        <span class="brand-badge">PRO</span>
      </a>
      <nav class="nav-ecosystem" aria-label="Tool Ecosystem">
        <a href="/es/" class="nav-link active">
          <iconify-icon icon="solar:document-text-bold"></iconify-icon>
          <span>Visor</span>
        </a>
        <a href="#tab-basic" class="nav-link">
          <iconify-icon icon="solar:book-bookmark-bold"></iconify-icon>
          <span>Guía Rápida</span>
        </a>
        <a href="/pdf-to-md.html" class="nav-link">
          <iconify-icon icon="solar:file-corrupted-linear"></iconify-icon>
          <span>PDF a MD</span>
        </a>
        <a href="/md-to-card.html" class="nav-link">
          <iconify-icon icon="solar:gallery-wide-linear"></iconify-icon>
          <span>MD a Tarjeta</span>
        </a>
      </nav>
    </div>

    <div class="header-actions">
      <!-- Document Preset Picker -->
      <div class="header-control-item" title="Load Sample Markdown Template">
        <select id="sampleSelect" class="select-control" aria-label="Load Sample Markdown">
          <option value="spec">Ejemplo: Especificación RFC (Completa)</option>
          <option value="readme">Ejemplo: Guía README</option>
          <option value="math">Ejemplo: Fórmulas Matemáticas</option>
          <option value="llm">Ejemplo: Respuesta de IA</option>
        </select>
      </div>

      <!-- Visual Theme Switcher -->
      <div class="header-control-item" title="Switch Color Theme">
        <select id="themeSelect" class="select-control" aria-label="Select Color Theme">
          <option value="github-light">Tema: Claro</option>
          <option value="github-dark">Tema: Oscuro</option>
          <option value="sepia">Tema: Sepia</option>
          <option value="cyber">Tema: Midnight</option>
        </select>
      </div>

      <!-- Segmented View Mode Controller -->
      <div class="btn-group view-mode-segmented" role="group" aria-label="View Mode Switcher">
        <button id="btnModeSplit" class="btn-icon-text active" title="Split Screen Mode">
          <iconify-icon icon="solar:align-horizontal-center-bold"></iconify-icon>
          <span>Dividir</span>
        </button>
        <button id="btnModePreview" class="btn-icon-text" title="Preview Only Mode">
          <iconify-icon icon="solar:eye-bold"></iconify-icon>
          <span>Vista</span>
        </button>
        <button id="btnModeEditor" class="btn-icon-text" title="Editor Only Mode">
          <iconify-icon icon="solar:pen-bold"></iconify-icon>
          <span>Editor</span>
        </button>
      </div>

      <!-- Quick Export & Card Actions on Header -->
      <div class="header-primary-actions">
        <a href="/md-to-card.html" id="btnMakeCard" class="btn btn-outline btn-header-action" title="Generate Social & Knowledge Card">
          <iconify-icon icon="solar:gallery-wide-bold"></iconify-icon>
          <span>Tarjeta</span>
        </a>
        <button id="btnDownloadMd" class="btn btn-primary btn-header-action" title="Download Markdown Document (.md)">
          <iconify-icon icon="solar:download-linear"></iconify-icon>
          <span>Descargar</span>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button id="btnMobileMenu" class="btn-mobile-menu" type="button" aria-label="Open Navigation & Tools Menu">
        <iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon>
      </button>
    </div>
  </header>

  <!-- Mobile Navigation & Actions Drawer -->
  <div id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <div class="mobile-drawer-header">
      <span class="mobile-drawer-title">Herramientas y Menú</span>
      <button id="btnCloseMobileDrawer" class="btn-drawer-close" type="button" aria-label="Close Menu">
        <iconify-icon icon="solar:close-circle-linear"></iconify-icon>
      </button>
    </div>
    <div class="mobile-drawer-content">
      <div class="drawer-group">
        <span class="drawer-group-title">Ecosystem</span>
        <div class="drawer-links">
          <a href="/es/" class="drawer-link active"><iconify-icon icon="solar:document-text-bold"></iconify-icon> Viewer</a>
          <a href="/pdf-to-md.html" class="drawer-link"><iconify-icon icon="solar:file-corrupted-linear"></iconify-icon> PDF to MD</a>
          <a href="/md-to-card.html" class="drawer-link"><iconify-icon icon="solar:gallery-wide-linear"></iconify-icon> MD to Card</a>
          <a href="#tab-basic" class="drawer-link"><iconify-icon icon="solar:book-bookmark-bold"></iconify-icon> Cheatsheet</a>
        </div>
      </div>
      <div class="drawer-group">
        <span class="drawer-group-title">Export & Share</span>
        <div class="drawer-actions-grid">
          <button id="btnMobileCopyMd" class="drawer-btn" type="button"><iconify-icon icon="solar:copy-linear"></iconify-icon> Copy MD</button>
          <button id="btnMobileCopyHtml" class="drawer-btn" type="button"><iconify-icon icon="solar:code-linear"></iconify-icon> Copy HTML</button>
          <button id="btnMobileDownload" class="drawer-btn" type="button"><iconify-icon icon="solar:download-linear"></iconify-icon> Download .md</button>
          <button id="btnMobileExportHtml" class="drawer-btn" type="button"><iconify-icon icon="solar:export-bold"></iconify-icon> Export HTML</button>
          <button id="btnMobilePdf" class="drawer-btn" type="button"><iconify-icon icon="solar:printer-linear"></iconify-icon> Print PDF</button>
          <a href="/md-to-card.html" class="drawer-btn" style="text-decoration:none;"><iconify-icon icon="solar:gallery-wide-bold"></iconify-icon> Make Card</a>
        </div>
      </div>
    </div>
  </div>
  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" aria-hidden="true"></div>

  <!-- Workspace Toolbar / Stats Bar -->
  <div class="workspace-toolbar">
    <div class="toolbar-stats">
      <span class="stat-item"><iconify-icon icon="solar:document-text-linear"></iconify-icon> Palabras: <strong id="statWords" class="stat-value">0</strong></span>
      <span class="stat-sep">/</span>
      <span class="stat-item"><iconify-icon icon="solar:text-square-linear"></iconify-icon> Caracteres: <strong id="statChars" class="stat-value">0</strong></span>
      <span class="stat-sep">/</span>
      <span class="stat-item"><iconify-icon icon="solar:clock-circle-linear"></iconify-icon> Tiempo: <strong id="statReadTime" class="stat-value">0 min</strong></span>
    </div>

    <div class="toolbar-controls">
      <!-- Sincronizar Toggle -->
      <label class="toolbar-checkbox" title="Keep editor and preview scrolling in sync">
        <input type="checkbox" id="toggleSyncScroll" checked>
        <span><iconify-icon icon="solar:round-transfer-vertical-linear"></iconify-icon> Sincronizar</span>
      </label>

      <div class="toolbar-divider"></div>

      <!-- File & Clean Slate -->
      <input type="file" id="fileInput" accept=".md,.markdown,.txt,.pdf" style="display: none;">
      <button id="btnOpenFile" class="btn-icon-text btn-outline" title="Open Local Markdown or PDF File">
        <iconify-icon icon="solar:folder-open-bold"></iconify-icon>
        <span>Abrir</span>
      </button>
      <button id="btnClear" class="btn-icon-text btn-outline" title="Clear Editor Content">
        <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
        <span>Limpiar</span>
      </button>

      <div class="toolbar-divider"></div>

      <!-- Copy Operations -->
      <button id="btnCopyMd" class="btn-icon-text btn-outline" title="Copy Raw Markdown Text">
        <iconify-icon icon="solar:copy-linear"></iconify-icon>
        <span>Copiar MD</span>
      </button>
      <button id="btnCopyHtml" class="btn-icon-text btn-outline" title="Copy Rendered HTML Code">
        <iconify-icon icon="solar:code-2-bold"></iconify-icon>
        <span>Copiar HTML</span>
      </button>

      <div class="toolbar-divider"></div>

      <!-- Document Export Operations -->
      <button id="btnExportPdf" class="btn-icon-text btn-outline" title="Print Document as Clean PDF">
        <iconify-icon icon="solar:printer-linear"></iconify-icon>
        <span>PDF</span>
      </button>
      <button id="btnExportHtml" class="btn-icon-text btn-outline" title="Export as Standalone HTML File">
        <iconify-icon icon="solar:export-bold"></iconify-icon>
        <span>Exportar HTML</span>
      </button>
    </div>
  </div>
