name: 💡 Feature Request
description: Suggest an idea or enhancement for MdPreview
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We welcome community suggestions to make MdPreview even better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      placeholder: Describe the desired feature or how it should work.
    validations:
      required: true
